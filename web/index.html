<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chakravat</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000066'/%3E%3Cpath d='M16 6c6 0 9 4 9 7s-3 5-6 5c-2 0-3-1-3-2 0-2 3-2 3-4' fill='none' stroke='%23fff' stroke-width='2.4' stroke-linecap='round'/%3E%3Cpath d='M16 26c-6 0-9-4-9-7s3-5 6-5c2 0 3 1 3 2 0 2-3 2-3 4' fill='none' stroke='%23ff9933' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/vendor/maplibre-gl.css">
<style>
:root{
  --navy:#000066; --navy-2:#001a80; --band:#c9d6ea; --band-2:#dfe7f4;
  --panel:#ffffff; --panel-2:#f2f5fa; --panel-3:#e8eef7;
  --ink:#101010; --ink-2:#33415c; --ink-3:#5a6b8c;
  --rule:#b9c6dd; --rule-2:#8fa3c4;
  --firebrick:#b22222; --link:#0000cc; --heading:#800080;

  --accent:#7fa8d8;
  --saffron:#ff9933; --green:#138808;
  --d:#5C9BC6; --dd:#3FB8AC; --cs:#D6AE2E; --scs:#EE8C40;
  --vscs:#E4614A; --escs:#C74765; --sucs:#9B4A88;
  --warn:#b06000; --good:#136c3a;
  --f-head:"Times New Roman",Times,Georgia,serif;
  --f-body:Arial,"Helvetica Neue",Helvetica,sans-serif;
  --f-mono:"Courier New",Consolas,monospace;
}
*{box-sizing:border-box}

body{margin:0;background:var(--navy);color:var(--ink);font-family:var(--f-body);
  font-size:13px;height:100vh;overflow:hidden;display:flex;flex-direction:column}
button,select{font-family:inherit;font-size:inherit;color:inherit}

/* ---- masthead ---------------------------------------------------------- */
.govstrip{background:var(--navy);color:#dfe7f4;font-size:10.5px;padding:3px 12px;
  display:flex;gap:14px;align-items:center;flex-wrap:wrap;letter-spacing:.02em}
.govstrip .sp{flex:1}
.govstrip b{color:#fff;font-weight:700}
.tricolour{height:3px;display:flex}
.tricolour i{flex:1}
.tricolour i:nth-child(1){background:var(--saffron)}
.tricolour i:nth-child(2){background:#fff}
.tricolour i:nth-child(3){background:var(--green)}

header{background:var(--band);border-bottom:3px solid var(--firebrick);
  padding:8px 14px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.masthead{text-align:center;flex:1;min-width:240px}
.brand{font-family:var(--f-head);font-weight:700;font-size:1.6rem;color:var(--navy);
  line-height:1.1;letter-spacing:.01em}
.brand span{color:var(--firebrick)}
.tagline{font-family:var(--f-body);font-size:11px;color:var(--heading);font-weight:700;margin-top:2px}
.disclaimer{font-size:10px;color:var(--firebrick);font-weight:700;margin-top:3px;
  text-transform:uppercase;letter-spacing:.04em}
.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
select{background:#fff;border:1px solid var(--rule-2);padding:4px 7px;border-radius:0;
  font-size:12px;color:var(--ink)}
select:focus-visible{outline:2px solid var(--navy);outline-offset:1px}
.lvl{display:flex;border:1px solid var(--rule-2);background:#fff}
.lvl button{background:#fff;border:0;border-right:1px solid var(--rule);padding:4px 9px;
  cursor:pointer;font-size:11px;color:var(--ink-2)}
.lvl button:last-child{border-right:0}
.lvl button[aria-pressed="true"]{background:var(--navy);color:#fff;font-weight:700}

/* ---- layout ------------------------------------------------------------ */
main{display:grid;grid-template-columns:1fr 412px;flex:1;min-height:0;
  gap:6px;padding:6px;background:var(--navy)}
@media (max-width:1000px){main{grid-template-columns:1fr;grid-template-rows:52vh 1fr}}
main > *{min-height:0}
#map{width:100%;height:100%;background:#eef2f7;border:3px solid var(--firebrick)}
aside{background:var(--panel);border:3px solid var(--firebrick);overflow-y:auto}

.tabs{display:flex;position:sticky;top:0;background:var(--band-2);z-index:2;
  border-bottom:2px solid var(--navy)}
.tabs button{flex:1;background:var(--band-2);border:0;border-right:1px solid var(--rule);
  padding:7px 4px;cursor:pointer;font-size:10.5px;font-weight:700;letter-spacing:.02em;
  text-transform:uppercase;color:var(--ink-2)}
.tabs button:last-child{border-right:0}
.tabs button[aria-selected="true"]{background:var(--navy);color:#fff}
.pane{padding:12px 14px;display:none}
.pane.on{display:block}

/* ---- content ----------------------------------------------------------- */
h2{font-family:var(--f-head);font-weight:700;font-size:1.32rem;margin:0 0 2px;color:var(--navy)}
.sub{font-size:11px;color:var(--ink-3);margin-bottom:10px}
.chip{display:inline-block;padding:3px 9px;border:1px solid rgba(0,0,0,.35);
  font-size:10.5px;font-weight:700;letter-spacing:.03em;color:#101010}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--rule-2);
  margin:10px 0 14px}
.stats div{background:var(--panel-2);padding:7px 10px;border-right:1px solid var(--rule);
  border-bottom:1px solid var(--rule)}
.stats div:nth-child(2n){border-right:0}
.stats dt{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);
  margin-bottom:2px;font-weight:700}
.stats dd{margin:0;font-family:var(--f-head);font-weight:700;font-size:1.06rem;
  font-variant-numeric:tabular-nums;color:var(--navy)}

h3{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  color:var(--heading);margin:16px 0 6px;text-decoration:underline;text-underline-offset:3px}
table{width:100%;border-collapse:collapse;font-size:11.5px;font-variant-numeric:tabular-nums;
  border:1px solid var(--navy)}
th{text-align:left;background:var(--navy);color:#fff;font-size:9.5px;letter-spacing:.04em;
  text-transform:uppercase;padding:5px 6px;font-weight:700;border-right:1px solid var(--navy-2)}
th:last-child{border-right:0}
td{padding:5px 6px;border-bottom:1px solid var(--rule);border-right:1px solid var(--rule);color:var(--ink)}
td:last-child{border-right:0}
tbody tr:nth-child(odd){background:var(--panel-2)}
tr:last-child td{border-bottom:0}
td.n{font-variant-numeric:tabular-nums}

.alert{border:1px solid var(--warn);border-left:5px solid var(--warn);background:#fdf4e6;
  padding:8px 11px;margin:10px 0;font-size:11.5px;line-height:1.5}
.alert b{color:var(--warn);font-size:10px;letter-spacing:.05em;text-transform:uppercase;
  display:block;margin-bottom:3px;font-weight:700}
.quiet{border-color:var(--rule-2);border-left-color:var(--rule-2);background:var(--panel-2)}
.quiet b{color:var(--ink-3)}

pre{background:#fbfbf7;border:1px solid var(--rule-2);padding:10px;font-family:var(--f-mono);
  font-size:10.5px;line-height:1.5;overflow-x:auto;white-space:pre;color:#101010;margin:0}
.note{font-size:11px;color:var(--ink-2);line-height:1.5;margin-top:11px;padding-top:9px;
  border-top:1px solid var(--rule)}
.spark{width:100%;height:120px;display:block;margin:5px 0 3px;background:#fff;
  border:1px solid var(--rule)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:10px;color:var(--ink-2);margin-top:6px}
.legend i{display:inline-block;width:9px;height:9px;margin-right:4px;vertical-align:-1px;
  border:1px solid rgba(0,0,0,.3)}
.empty{color:var(--ink-3);font-size:12px;padding:20px 0;text-align:center}
.maplibregl-popup-content{border:2px solid var(--firebrick);border-radius:0}
/* no position here: maplibre positions markers absolutely, and overriding it
   stacks every label down the page in document flow */
.place{font:10px Arial,sans-serif;color:#2b2b2b;padding-left:7px;
  pointer-events:none;white-space:nowrap;text-shadow:0 0 2px #fff,0 0 2px #fff}
.place:before{content:"";position:absolute;left:0;top:50%;width:4px;height:4px;
  margin-top:-2px;background:#2b2b2b;border-radius:50%;box-shadow:0 0 0 1px #fff}
</style>
</head>
<body>

<div class="govstrip">
  <span>Prototype for SIH &middot; Smart India Hackathon, problem statement <b>26070</b></span>
  <span class="sp"></span>
  <span>Ministry of Earth Sciences &middot; India Meteorological Department</span>
</div>
<div class="tricolour"><i></i><i></i><i></i></div>

<header>
  <div class="masthead">
    <div class="brand">CHAKRA<span>VAT</span></div>
    <div class="tagline">Tropical Cyclone Identification, Classification and Prediction System
      for North Indian Ocean</div>
    <div style="margin-top:4px;font-size:11.5px">
      <a href="/live" style="color:#cfe0ff">Live alert feed &rsaquo;</a>
    </div>
  </div>
  <div class="controls">
  <select id="season" aria-label="Season"></select>
  <select id="storm" aria-label="Storm"></select>
  <select id="issue" aria-label="Forecast issued at" title="Rewind: issue the forecast from any earlier fix"></select>
  <div class="lvl" role="group" aria-label="Confidence level">
    <button data-lvl="0.5">50%</button>
    <button data-lvl="0.67" aria-pressed="true">67%</button>

  </div>
  <div class="lvl" role="group" aria-label="Layers">
    <button id="satToggle" aria-pressed="false" title="Overlay the GridSat infrared scene">Satellite</button>
  </div>
  </div>
</header>

<main>
  <div id="map"></div>
  <aside>
    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-pane="fc">Forecast</button>
      <button role="tab" aria-selected="false" data-pane="lf">Landfall</button>
      <button role="tab" aria-selected="false" data-pane="im">Imagery</button>
      <button role="tab" aria-selected="false" data-pane="pl">Pipeline</button>
      <button role="tab" aria-selected="false" data-pane="lv">Live</button>
      <button role="tab" aria-selected="false" data-pane="bl">Bulletin</button>
      <button role="tab" aria-selected="false" data-pane="sk">Skill</button>
    </div>
    <div class="pane on" id="pane-fc"></div>
    <div class="pane" id="pane-lf"></div>
    <div class="pane" id="pane-im"></div>
    <div class="pane" id="pane-pl"></div>
    <div class="pane" id="pane-bl"></div>
    <div class="pane" id="pane-lv"></div>
    <div class="pane" id="pane-sk"></div>
  </aside>
</main>

<script src="/static/vendor/maplibre-gl.js"></script>
<script>
const CAT = {
  "Low Pressure Area":"#6B858E", "Depression":"#5C9BC6", "Deep Depression":"#3FB8AC",
  "Cyclonic Storm":"#D6AE2E", "Severe Cyclonic Storm":"#EE8C40",
  "Very Severe Cyclonic Storm":"#E4614A",
  "Extremely Severe Cyclonic Storm":"#C74765", "Super Cyclonic Storm":"#9B4A88"
};
const SHORT = {
  "Low Pressure Area":"LPA","Depression":"D","Deep Depression":"DD","Cyclonic Storm":"CS",
  "Severe Cyclonic Storm":"SCS","Very Severe Cyclonic Storm":"VSCS",
  "Extremely Severe Cyclonic Storm":"ESCS","Super Cyclonic Storm":"SuCS"
};
const catColor = c => CAT[c] || "#6B858E";
const api = p => fetch(p).then(r => { if(!r.ok) throw new Error(r.status); return r; });

let level = 0.67, current = null, map = null, mapReady = false;

/* A circle on the ground, in GeoJSON, for the forecast cone. */
function circle(lat, lon, km, n=72){
  const pts=[], dLat=km/110.574;
  for(let i=0;i<=n;i++){
    const t=2*Math.PI*i/n;
    const dLon=km/(111.320*Math.cos(lat*Math.PI/180));
    pts.push([lon+dLon*Math.cos(t), lat+dLat*Math.sin(t)]);
  }
  return {type:"Feature", geometry:{type:"Polygon", coordinates:[pts]}};
}
const src = (id,d) => { const s=map.getSource(id); if(s) s.setData(d); };

/* City names as HTML markers: a symbol layer would need glyph files from a
   font server, and the map is meant to work with no network. */
async function addPlaceLabels(){
  try{
    const fc = await (await api("/static/vendor/places_labels.geojson")).json();
    const capital = p => p.capital === "Admin-0 capital";
    // capitals first, then by population; skip anything crowding a placed
    // label, so Kolkata wins over Haora and New Delhi over Delhi
    const cands = fc.features.filter(f => {
      const p = f.properties, [lon, lat] = f.geometry.coordinates;
      return lon >= 35 && lon <= 105 && lat >= -12 && lat <= 38 &&
             (p.pop >= 4e6 || capital(p));
    }).sort((a, b) => (capital(b.properties) - capital(a.properties)) ||
                      (b.properties.pop - a.properties.pop));
    const placed = [];
    for(const f of cands){
      const p = f.properties, [lon, lat] = f.geometry.coordinates;
      if(placed.some(([x, y]) => Math.hypot(x - lon, y - lat) < 1.5)) continue;
      placed.push([lon, lat]);
      const el = document.createElement("div");
      el.className = "place";
      el.textContent = p.name;
      new maplibregl.Marker({element:el, anchor:"left"}).setLngLat([lon, lat]).addTo(map);
    }
  }catch(e){ /* labels are decoration; the map works without them */ }
}

function initMap(){
  map = new maplibregl.Map({
    container:"map",
    /* Offline basemap. Boundaries are Natural Earth's India point-of-view
       edition, so the map shows India's boundary as the Government of India
       depicts it, and nothing here needs the network. */
    style:{version:8, sources:{countries:{type:"geojson",
      data:"/static/vendor/countries_ind.geojson",
      attribution:"Boundaries: Natural Earth (India point of view)"}},
      layers:[{id:"ground",type:"background",paint:{"background-color":"#dce7f2"}},
              {id:"land-f",type:"fill",source:"countries",
               paint:{"fill-color":"#f7f5ef"}},
              {id:"borders-l",type:"line",source:"countries",
               paint:{"line-color":"#8c8c8c","line-width":0.8}}]},
    center:[85,15], zoom:3.6, attributionControl:{compact:true}
  });
  map.addControl(new maplibregl.NavigationControl({showCompass:false}),"top-left");
  const onMapReady = () => {
    const empty = {type:"FeatureCollection",features:[]};
    for(const id of ["cone","track","fcline","pts","fpts"]) map.addSource(id,{type:"geojson",data:empty});
    /* wind probability goes underneath everything else: it is the widest thing
       on the map and would bury the track if it sat on top. */
    map.addSource("windprob",{type:"geojson",data:empty});
    map.addLayer({id:"windprob-f",type:"fill",source:"windprob",
      paint:{"fill-color":["get","colour"],"fill-opacity":["get","alpha"]}});
    map.addLayer({id:"windprob-l",type:"line",source:"windprob",
      paint:{"line-color":["get","colour"],"line-width":0.8,"line-opacity":.6}});
    map.addLayer({id:"cone-f",type:"fill",source:"cone",
      paint:{"fill-color":"#138808","fill-opacity":.13}});
    map.addLayer({id:"cone-l",type:"line",source:"cone",
      paint:{"line-color":"#138808","line-width":1.2,"line-opacity":.75}});
    map.addLayer({id:"track-l",type:"line",source:"track",
      paint:{"line-color":"#101010","line-width":2.4}});
    map.addLayer({id:"fc-l",type:"line",source:"fcline",
      paint:{"line-color":"#d40000","line-width":2.4,"line-dasharray":[2.2,1.4]}});
    map.addLayer({id:"pts-c",type:"circle",source:"pts",
      paint:{"circle-radius":4.6,"circle-color":["get","color"],
             "circle-stroke-width":1.2,"circle-stroke-color":"#ffffff"}});
    map.addLayer({id:"fpts-c",type:"circle",source:"fpts",
      paint:{"circle-radius":5.4,"circle-color":["get","color"],
             "circle-stroke-width":1.6,"circle-stroke-color":"#101010"}});

    /* Pipeline output: what the system found without prior data*/
    map.addSource("dets",{type:"geojson",data:empty});
    map.addSource("dettrack",{type:"geojson",data:empty});
    map.addLayer({id:"dettrack-l",type:"line",source:"dettrack",
      paint:{"line-color":"#EE8C40","line-width":2,"line-dasharray":[1.5,1]}});
    map.addLayer({id:"dets-c",type:"circle",source:"dets",
      paint:{"circle-radius":["interpolate",["linear"],["get","score"],0.3,5,1,10],
             "circle-color":"#EE8C40","circle-opacity":0.85,
             "circle-stroke-width":1.5,"circle-stroke-color":"#101010"}});
    map.on("click","dets-c", e => {
      const p=e.features[0].properties;
      new maplibregl.Popup({closeButton:false}).setLngLat(e.lngLat)
        .setHTML(`<div style="font-family:monospace;font-size:11px;color:#0A1418">
          detected ${ist(p.time)}<br>score ${(+p.score).toFixed(2)}
          ${p.scene?`<br>scene ${p.scene}`:""}
          ${p.vmax?`<br>${(+p.vmax).toFixed(0)} kt`:""}</div>`).addTo(map);
    });
    map.on("click","pts-c", e => {
      const p=e.features[0].properties;
      new maplibregl.Popup({closeButton:false})
        .setLngLat(e.lngLat)
        .setHTML(`<div style="font-family:monospace;font-size:11px;color:#0A1418">
          ${ist(p.time)}<br>${p.vmax} kt &middot; ${p.cat}</div>`).addTo(map);
    });
    map.on("mouseenter","pts-c",()=>map.getCanvas().style.cursor="pointer");
    map.on("mouseleave","pts-c",()=>map.getCanvas().style.cursor="");
    mapReady = true;
    addPlaceLabels();

    if(current) paintCurrent();
  };
  
  if(map.isStyleLoaded()) onMapReady(); else map.on("load", onMapReady);

  
  boot();
}

/* Intensity history plus the forecast band, drawn inline. */
function sparkline(track, fc){
  const W=364,H=120,P={l:30,r:8,t:10,b:18};
  const hist=track.map((p,i)=>({x:i,v:p.vmax_kt}));
  const n=hist.length, span=n+ (fc?fc.forecast.length:0);
  const all=hist.map(p=>p.v).concat(fc?fc.forecast.flatMap(p=>[p.vmax_lower,p.vmax_upper]):[]);
  const lo=Math.max(0,Math.min(...all)-8), hi=Math.max(...all)+8;
  const X=i=>P.l+(W-P.l-P.r)*(i/Math.max(span-1,1));
  const Y=v=>P.t+(H-P.t-P.b)*(1-(v-lo)/Math.max(hi-lo,1));
  let s=`<svg class="spark" viewBox="0 0 ${W} ${H}">`;
  for(const [thr,lab] of [[34,"CS"],[64,"VSCS"],[90,"ESCS"],[120,"SuCS"]]){
    if(thr>lo&&thr<hi) s+=`<line x1="${P.l}" y1="${Y(thr)}" x2="${W-P.r}" y2="${Y(thr)}"
      stroke="#9fb0cc" stroke-dasharray="2 3" stroke-width="1"/>
      <text x="2" y="${Y(thr)+3}" fill="#5a6b8c" font-size="8" font-family="monospace">${lab}</text>`;
  }
  if(fc){
    const b=fc.forecast, up=b.map((p,i)=>`${X(n-1+i+1)},${Y(p.vmax_upper)}`).join(" ");
    const dn=b.map((p,i)=>`${X(n-1+i+1)},${Y(p.vmax_lower)}`).reverse().join(" ");
    s+=`<polygon points="${X(n-1)},${Y(hist[n-1].v)} ${up} ${dn} ${X(n-1)},${Y(hist[n-1].v)}"
        fill="#138808" opacity=".16"/>`;
    s+=`<polyline points="${X(n-1)},${Y(hist[n-1].v)} ${b.map((p,i)=>`${X(n-1+i+1)},${Y(p.vmax_kt)}`).join(" ")}"
        fill="none" stroke="#d40000" stroke-width="2" stroke-dasharray="3 2"/>`;
  }
  s+=`<polyline points="${hist.map(p=>`${X(p.x)},${Y(p.v)}`).join(" ")}"
      fill="none" stroke="#101010" stroke-width="2"/>`;
  s+=`<text x="2" y="${H-4}" fill="#5a6b8c" font-size="8" font-family="monospace">kt</text></svg>`;
  return s;
}


function paintCurrent(){
  if(!mapReady || !current) return;
  const {d, fc} = current;

  src("track", {type:"Feature", geometry:{type:"LineString",
      coordinates:d.track.map(p=>[p.lon,p.lat])}});
  src("pts", {type:"FeatureCollection", features:d.track.map(p=>({
      type:"Feature", geometry:{type:"Point",coordinates:[p.lon,p.lat]},
      properties:{color:catColor(p.category), time:p.time,
                  vmax:p.vmax_kt.toFixed(0), cat:SHORT[p.category]||""}}))});

  if(fc){
    const c=fc.current, pts=fc.forecast;
    src("cone", {type:"FeatureCollection",
        features:pts.map(p=>circle(p.lat,p.lon,p.radius_km))});
    src("fcline", {type:"Feature", geometry:{type:"LineString",
        coordinates:[[c.lon,c.lat],...pts.map(p=>[p.lon,p.lat])]}});
    src("fpts", {type:"FeatureCollection", features:pts.map(p=>({
        type:"Feature", geometry:{type:"Point",coordinates:[p.lon,p.lat]},
        properties:{color:catColor(p.category)}}))});
  } else {
    for(const id of ["cone","fcline","fpts","windprob"]) src(id,{type:"FeatureCollection",features:[]});
  }

  const lons=d.track.map(p=>p.lon), lats=d.track.map(p=>p.lat);
  map.fitBounds([[Math.min(...lons)-3,Math.min(...lats)-3],
                 [Math.max(...lons)+3,Math.max(...lats)+3]],
                {padding:60, duration:700, maxZoom:6});
}

/* time = a fix time to issue the forecast from; null means the API's default,
   the latest fix whose 24 h outcome is known */
async function loadStorm(sid, time=null){
  const d = await (await api(`/api/storm/${sid}`)).json();
  // Keep the header in step when a storm is loaded programmatically.
  const ss = document.getElementById("season"), st = document.getElementById("storm");
  if(ss.value !== String(d.season)){
    ss.value = String(d.season);
    const list = (await (await api(`/api/storms?season=${d.season}`)).json()).storms;
    st.innerHTML = list.map(s=>`<option value="${s.SID}">${s.name||"Unnamed"} — ${s.peak_kt.toFixed(0)} kt</option>`).join("");
  }
  st.value = sid;
  const t = time ? `&time=${encodeURIComponent(time)}` : "";
  let fc=null, lf=null;
  try{ fc = await (await api(`/api/storm/${sid}/forecast?level=${level}${t}`)).json(); }catch(e){}
  try{ lf = await (await api(`/api/storm/${sid}/landfall?level=${level}${t}`)).json(); }catch(e){}
  current = {d, fc, lf};

  // every fix is a possible issue time: rewinding to before landfall shows
  // what the system would have said while there was still time to act
  const iss = document.getElementById("issue");
  iss.innerHTML = d.track.map(p => `<option value="${p.time}">issued ${ist(p.time)} · ${p.vmax_kt.toFixed(0)} kt</option>`).join("");
  if(fc) iss.value = fc.issued_at;

  paintCurrent();


  const issued = fc ? fc.issued_at : d.track[d.track.length-1].time;
  if(satOn) setSatellite(true, issued);
  for(const id of ["dets","dettrack"]) src(id,{type:"FeatureCollection",features:[]});
  const pl = document.getElementById("pane-pl");
  delete pl.dataset.ran;
  pl.innerHTML = `<div class="empty">Open this tab to run the full chain on ${issued}.</div>`;

  render();
}

const esc = s => String(s).replace(/[<>&"]/g, c => ({"<":"&lt;",">":"&gt;","&":"&amp;","\"":"&quot;"}[c]));

/* Everything the API returns is UTC: best track sits on the synoptic hours and
   the satellite slots are UTC too. IMD publishes in IST, so that is what the
   panel shows. Conversion happens here, at the point of display, and is always
   labelled - anything sent back to the API keeps its UTC string untouched,
   because the archive is keyed on it. */
const IST_OFFSET_MIN = 330;
function ist(t, label = true){
  if(!t) return "";
  const d = new Date(String(t).trim().replace(" ", "T").replace(/Z$/, "") + "Z");
  if(isNaN(d)) return String(t);
  const p = new Date(d.getTime() + IST_OFFSET_MIN * 60000);
  const z = n => String(n).padStart(2, "0");
  return `${p.getUTCFullYear()}-${z(p.getUTCMonth()+1)}-${z(p.getUTCDate())} `
       + `${z(p.getUTCHours())}:${z(p.getUTCMinutes())}${label ? " IST" : ""}`;
}

async function renderExposure(d, issued){
  const el = document.getElementById("exposure");
  try{
    const e = await (await api(`/api/storm/${d.sid}/exposure?time=${encodeURIComponent(issued)}&level=${level}`)).json();
    if(!current || current.d.sid !== d.sid) return;   // a newer storm was picked meanwhile
    el.innerHTML = !e.places.length
      ? `<div class="alert quiet"><b>None</b> No place of 100,000 or more inside the zone.</div>`
      : `<table><thead><tr><th>Place</th><th>Country</th><th>From</th><th>Population</th></tr></thead>
         <tbody>${e.places.slice(0, 12).map(p => `<tr><td>${esc(p.name)}</td><td>${esc(p.country)}</td>
           <td class="n">${p.first_inside_h.toFixed(0)} h</td>
           <td class="n">${(p.population/1e6).toFixed(p.population >= 1e6 ? 1 : 2)} M</td></tr>`).join("")}</tbody></table>
         <div class="note">${e.places.length} places in all. The zone is the ${(100*level).toFixed(0)}%
           cone widened by the typical radius of gale-force winds for the forecast
           intensity (120–213 km, from JTWC wind radii in IBTrACS). It says who is
           in the path, not how badly they will be hit. Populations are Natural
           Earth metro estimates.</div>`;
  }catch(err){ el.innerHTML = `<div class="empty">Places unavailable.</div>`; }
}

/* Who gets the wind, rather than where the centre goes. Each ensemble member
   sweeps its own wind field along its own track; the probability is the share
   of members covering a point at any time in the window. */
const WIND_BAND = [
  {at:0.75, colour:"#7a0177", alpha:0.42},
  {at:0.50, colour:"#c51b8a", alpha:0.34},
  {at:0.25, colour:"#f768a1", alpha:0.26},
  {at:0.125, colour:"#fbb4b9", alpha:0.20},
];
let windThreshold = 0;          /* 0 = off, otherwise 34, 50 or 64 */
async function renderWind(d, issued){
  const box = document.getElementById("fc-wind");
  if(!box) return;
  const buttons = [34, 50, 64].map(t =>
    `<button data-wp="${t}" aria-pressed="${windThreshold === t}">${t} kt</button>`).join("");
  box.innerHTML = `<h3>Chance of damaging wind</h3>
    <div class="lvl" role="group" aria-label="Wind threshold" style="display:inline-flex">
      <button data-wp="0" aria-pressed="${windThreshold === 0}">Off</button>${buttons}
    </div>
    <div id="wp-body"><div class="note">The cone is where the centre may go. This is
      the chance a place sees wind of at least the chosen strength at any time in the
      next 72 hours, from the eight ensemble members sweeping their own wind fields
      along their own tracks.</div></div>`;
  box.querySelectorAll("button[data-wp]").forEach(b => b.onclick = () => {
    windThreshold = +b.dataset.wp;
    renderWind(d, issued);
  });
  if(!windThreshold){ src("windprob", {type:"FeatureCollection", features:[]}); return; }

  const body = document.getElementById("wp-body");
  body.innerHTML = `<div class="empty">Sweeping eight members…</div>`;
  let w;
  try{
    w = await (await api(`/api/storm/${d.sid}/wind_probability?time=${encodeURIComponent(issued||"")}&threshold=${windThreshold}`)).json();
  }catch(e){ body.innerHTML = `<div class="empty">Unavailable for this fix.</div>`; return; }
  if(!w || !w.contours){ body.innerHTML = `<div class="empty">No forecast from this fix.</div>`; return; }

  /* draw high probability last so it sits on top of the low bands */
  const feats = [];
  for(const band of [...WIND_BAND].reverse()){
    const c = w.contours.find(x => Math.abs(x.level - band.at) < 1e-6);
    if(!c) continue;
    for(const ring of c.rings){
      feats.push({type:"Feature", geometry:{type:"Polygon", coordinates:[ring]},
                  properties:{colour:band.colour, alpha:band.alpha, level:band.at}});
    }
  }
  src("windprob", {type:"FeatureCollection", features:feats});

  const v = w.verification || {};
  const rel = (v.reliability || []).filter(r => r.n > 200 && r.forecast > 0.01);
  body.innerHTML = `
    <dl class="stats">
      <div><dt>Area at 25% or more</dt><dd>${(w.summary.area_km2_at_25pct/1000).toFixed(0)}k km²</dd></div>
      <div><dt>Area at 50% or more</dt><dd>${(w.summary.area_km2_at_50pct/1000).toFixed(0)}k km²</dd></div>
    </dl>
    <div class="legend">${WIND_BAND.map(b =>
      `<span><i style="background:${b.colour};opacity:${b.alpha+0.3}"></i>${(100*b.at).toFixed(0)}%</span>`).join("")}</div>
    ${rel.length ? `<h3>Has it been right before?</h3>
      <table><thead><tr><th>We said</th><th>It happened</th><th>Forecasts</th></tr></thead>
      <tbody>${rel.map(r => `<tr>
        <td class="n">${(100*r.forecast).toFixed(0)}%</td>
        <td class="n">${(100*r.observed).toFixed(0)}%</td>
        <td class="n">${r.n.toLocaleString()}</td></tr>`).join("")}</tbody></table>
      <div class="note">Every forecast on held-out storms, binned by the probability it
        gave and compared with how often the wind actually arrived. Brier skill
        ${v.brier_skill_score != null ? (v.brier_skill_score>=0?"+":"")+v.brier_skill_score.toFixed(2) : "—"}
        against forecasting the base rate every time.
        ${v.verifies ? "This verifies " + esc(v.verifies) + "." : ""}</div>`
      : `<div class="note">Verification has not been generated for this threshold yet.</div>`}
    ${(w.population_over_time||[]).some(r=>r.population>0) ? `
      <h3>People who may be in the wind</h3>
      <table><thead><tr><th>By</th><th>Places</th><th>Population</th></tr></thead>
      <tbody>${w.population_over_time.map(r=>`<tr>
        <td class="n">${r.by_h} h</td><td class="n">${r.places}</td>
        <td class="n">${r.population>=1e6 ? (r.population/1e6).toFixed(1)+" M"
                                          : (r.population/1e3).toFixed(0)+" k"}</td>
      </tr>`).join("")}</tbody></table>
      <div class="note">Cumulative, counting places where the chance is 25% or more by
        that lead time. Natural Earth metro populations: who is in the path, not how
        badly they are hit.</div>` : ""}
    ${(w.places||[]).length ? `
      <h3>Most likely first</h3>
      <table><thead><tr><th>Place</th><th>Chance</th><th>Earliest</th><th>Population</th></tr></thead>
      <tbody>${w.places.slice(0,12).map(p=>`<tr>
        <td>${esc(p.name)}${p.country?`<span style="color:var(--ink-3)">, ${esc(p.country)}</span>`:""}</td>
        <td class="n">${(100*p.probability).toFixed(0)}%</td>
        <td class="n">${p.earliest_h.toFixed(0)} h</td>
        <td class="n">${p.population>=1e6 ? (p.population/1e6).toFixed(1)+" M"
                                          : (p.population/1e3).toFixed(0)+" k"}</td>
      </tr>`).join("")}</tbody></table>
      ${w.places_total>12?`<div class="note">${w.places_total} places of 100,000 or more in all.</div>`:""}` : ""}
    <div class="note">${esc(w.note||"")}</div>`;
}

/* The forecast's answer to Grad-CAM: which inputs it rested on, measured by
   removing them and re-running the ensemble. */
let whyHorizon = 24;
function renderWhy(d, issued){
  /* ~10 s: eighteen groups re-run through the eight-member ensemble. behind a
     button so the forecast tab stays fast and the measuring is deliberate. */
  const box = document.getElementById("fc-why");
  if(!box) return;
  box.innerHTML = `<h3>Why this forecast</h3>
    <button class="chip" id="why-go" style="background:var(--navy);color:#fff;border:0;cursor:pointer">
      Measure what it rested on</button>
    <div class="note">Removes each input in turn and re-runs the forecast. Takes a
      few seconds.</div>`;
  document.getElementById("why-go").onclick = () => measureWhy(d, issued);
}

async function measureWhy(d, issued){
  const box = document.getElementById("fc-why");
  if(!box) return;
  const q = `time=${encodeURIComponent(issued || "")}&level=${level}&horizon=${whyHorizon}`;
  box.innerHTML = `<h3>Why this forecast</h3><div class="empty">Measuring…</div>`;
  let x;
  try{ x = await (await api(`/api/storm/${d.sid}/explain_forecast?${q}`)).json(); }
  catch(e){ box.innerHTML = ""; return; }
  if(!x || !x.track){ box.innerHTML = ""; return; }
  const max = Math.max(...x.track.map(r => r.track_shift_km), 1);
  box.innerHTML = `
    <h3>Why this forecast</h3>
    <div class="lvl" role="group" aria-label="Horizon" style="display:inline-flex;margin-bottom:8px">
      ${[6,12,24,48,72].map(h=>`<button data-h="${h}" aria-pressed="${h===whyHorizon}">${h} h</button>`).join("")}
    </div>
    <p style="margin:6px 0 10px;line-height:1.5">${esc(x.sentence)}</p>
    <table><thead><tr><th>Input</th><th>Moves position</th><th>Moves intensity</th></tr></thead>
    <tbody>${x.track.map(r=>`<tr>
      <td>${esc(r.label)}</td>
      <td class="n" style="width:88px">${r.track_shift_km.toFixed(0)} km
        <div style="background:var(--accent);height:5px;margin-top:2px;
                    width:${Math.max(2,100*r.track_shift_km/max)}%"></div></td>
      <td class="n" style="width:70px">${r.intensity_shift_kt>=0?"+":""}${r.intensity_shift_kt.toFixed(1)} kt</td>
    </tr>`).join("")}</tbody></table>
    <div class="note">Each row is that input replaced by its median across training,
      with the forecast re-run. Present position and intensity are held fixed —
      substituting those describes a different storm, not this one with less
      information. Correlated inputs are removed together, so time of year moves as
      a pair and shear as a triple. ${esc(x.caveat)}</div>`;
  box.querySelectorAll("button[data-h]").forEach(b => b.onclick = () => {
    whyHorizon = +b.dataset.h; measureWhy(d, issued);
  });
}

let bulletinLang = "en";
async function renderBulletin(d, issued){
  const el = document.getElementById("pane-bl");
  const q = `time=${encodeURIComponent(issued || "")}&level=${level}`;
  el.innerHTML = `
    <div class="lvl" role="group" aria-label="Bulletin language" style="display:inline-flex;margin-bottom:10px">
      <button data-lang="en" aria-pressed="${bulletinLang === "en"}">English</button>
      <button data-lang="hi" aria-pressed="${bulletinLang === "hi"}">हिंदी</button>
    </div>
    <a class="chip" style="background:var(--navy);color:#fff;margin-left:8px;text-decoration:none"
       href="/api/storm/${d.sid}/cap.xml?${q}" download="chakravat_${d.sid}.cap.xml">Download CAP alert</a>
    <div id="bl-text"><div class="empty">Loading…</div></div>
    <div id="bl-sms"></div>
    <div class="note">The CAP file is a Common Alerting Protocol 1.2 alert, the format
      NDMA's SACHET system carries, with English and Hindi sections and the threat
      zone as its area. It validates against the OASIS schema and is marked
      <i>Exercise</i>: a prototype, never a real warning.</div>`;
  el.querySelectorAll("button[data-lang]").forEach(b => b.onclick = () => {
    bulletinLang = b.dataset.lang;
    renderBulletin(d, issued);
  });
  try{
    const t = await (await api(`/api/storm/${d.sid}/bulletin?lang=${bulletinLang}&${q}`)).text();
    const box = document.getElementById("bl-text");
    if(box) box.innerHTML = `<pre>${esc(t)}</pre>`;
  }catch(err){
    const box = document.getElementById("bl-text");
    if(box) box.innerHTML = `<div class="empty">Bulletin unavailable.</div>`;
  }
  /* the end of the chain: CAP goes to SACHET, SACHET sends SMS, and an SMS is
     a character budget that depends on the script. */
  try{
    const m = await (await api(`/api/storm/${d.sid}/sms?lang=${bulletinLang}&${q}`)).json();
    const box = document.getElementById("bl-sms");
    const per = m.segments > 1 ? (m.encoding === "GSM-7" ? 153 : 67) : m.budget;
    const fill = Math.min(100, 100 * m.units / (m.segments * per));
    const over = m.segments > 1;
    if(box) box.innerHTML = `
      <h3>As an SMS</h3>
      <pre style="white-space:pre-wrap">${esc(m.text)}</pre>
      <div style="height:7px;background:var(--panel-3);border:1px solid var(--rule-2);
                  margin-top:7px">
        <i style="display:block;height:100%;width:${fill.toFixed(0)}%;
                  background:${over ? "var(--warn)" : "var(--navy)"}"></i>
      </div>
      <div style="font-size:10px;color:var(--ink-3);margin-top:3px;
                  font-variant-numeric:tabular-nums">
        ${m.units} of ${m.segments * per} units &middot; ${m.encoding} &middot;
        ${m.segments} segment${m.segments > 1 ? "s" : ""}
      </div>
      <div class="note">${m.encoding === "UCS-2"
        ? "Devanagari is outside the GSM 03.38 alphabet, so this is sent as UCS-2 and gets 70 units a segment instead of 160. The Hindi alert is written separately rather than translated, because the same advisory does not fit twice."
        : "Latin text uses the GSM 03.38 alphabet, which packs 160 units into one segment."}
        Optional detail is dropped first; the landfall time, the instruction and the
        not-an-IMD-warning line are never cut.</div>`;
  }catch(err){ /* the SMS panel is a bonus; the bulletin above is the product */ }
}

/* T1/T2/T3 read the same satellite scene the forecast was issued from. */
async function renderImagery(d, issued=null){
  const el = document.getElementById("pane-im");
  el.innerHTML = `<div class="empty">Reading satellite scene…</div>`;
  const t = issued ? `?time=${encodeURIComponent(issued)}` : "";
  const grab = async p => { try { return await (await api(p)).json(); }
                            catch(e){ return {available:false, reason:"request failed"}; } };
  const [scene, inten, status] = await Promise.all([
    grab(`/api/storm/${d.sid}/scene${t}`),
    grab(`/api/storm/${d.sid}/intensity_from_image${t}`),
    grab(`/api/vision/status`),
  ]);
  if(!current || current.d.sid !== d.sid) return;   // a newer storm was picked meanwhile

  const unavailable = m => `<div class="alert quiet"><b>Not available</b>${m}</div>`;

  let html = `<h2>Imagery</h2>
    <div class="sub">GridSat-B1 infrared &middot; ${status.gridsat_scenes||0} basin scenes on disk</div>`;

  html += `<h3>Dvorak scene (T2)</h3>`;
  if(scene.available){
    const rows = Object.entries(scene.probabilities).slice(0,5);
    html += `<span class="chip" style="background:var(--accent)">${scene.scene}</span>
      <span style="font-family:var(--f-mono);font-size:11px;color:var(--ink-3);margin-left:8px">
      ${(100*scene.confidence).toFixed(0)}% confidence &middot; ${ist(scene.scene_time)}</span>
      <table style="margin-top:10px"><tbody>${rows.map(([k,v])=>`<tr>
        <td>${k}</td><td class="n" style="width:52px">${(100*v).toFixed(1)}%</td>
        <td><div style="background:var(--accent);opacity:${0.35+0.65*v};height:7px;width:${Math.max(2,100*v)}%"></div></td>
      </tr>`).join("")}</tbody></table>
      ${scene.reliability ? `<div class="${scene.reliability.weak_on_this_sensor ? "alert" : "alert quiet"}"
             style="margin-top:10px"><b>How well this class reads on this sensor</b>
           ${esc(scene.reliability.note)}
           ${scene.reliability.weak_on_this_sensor
             ? " This is one of the two classes that does not survive the change of sensor: an eye is a hole in the cloud and transfers, while how cold and how uniform an overcast is does not. Treat this reading as weak."
             : ""}</div>` : ""}
      <div class="note">${scene.labels_note||""}</div>`;
  } else html += unavailable(scene.reason||"");

  html += `<h3>Intensity from image (T3)</h3>`;
  if(inten.available){
    const sign = inten.error_kt>=0 ? "+" : "";
    html += `<dl class="stats">
      <div><dt>From imagery</dt><dd>${inten.vmax_kt.toFixed(0)} kt${inten.interval
        ? ` <span style="color:var(--ink-3);font-size:.8em">(${inten.interval.lower_kt.toFixed(0)}–${inten.interval.upper_kt.toFixed(0)})</span>`
        : ""}</dd></div>
      <div><dt>Best track</dt><dd>${inten.best_track_kt.toFixed(0)} kt</dd></div>
      <div><dt>Difference</dt><dd>${sign}${inten.error_kt.toFixed(1)} kt</dd></div>
      <div><dt>Category</dt><dd style="font-size:.86rem">${inten.category}</dd></div>
    </dl>
    ${inten.interval ? `<div class="alert ${
        inten.best_track_kt >= inten.interval.lower_kt && inten.best_track_kt <= inten.interval.upper_kt
          ? "quiet" : ""}"><b>${(100*inten.interval.level).toFixed(0)}% interval</b>
      ${inten.interval.lower_kt.toFixed(0)}–${inten.interval.upper_kt.toFixed(0)} kt${
        inten.category_lower !== inten.category_upper
          ? `, spanning ${esc(inten.category_lower)} to ${esc(inten.category_upper)}` : ""}.
      ${inten.best_track_kt >= inten.interval.lower_kt && inten.best_track_kt <= inten.interval.upper_kt
        ? "Best track falls inside it."
        : "<strong>Best track falls outside it</strong> — one of the cases this level does not cover."}
      <br>Fitted on ${inten.interval.fitted_on} out-of-fold residuals in the
      ${esc(inten.interval.band)} kt band; this level contained
      ${(100*inten.interval.measured_coverage).toFixed(0)}% of held-out truths.</div>` : ""}
    <div class="note">Estimated from the satellite image alone — no best-track
      history, no position. This is the task the Dvorak technique performs.
      The interval is binned on what the model <i>said</i>, not on the truth,
      because the prediction is all that exists at inference. It reaches further
      up than down at the top of the scale, which is the severe-storm under-read
      showing through.</div>`;
  } else html += unavailable(inten.reason||"");

  if(scene.available || inten.available){
    html += `<h3>Where the models look</h3><div id="cam-box"><div class="empty">Computing attention maps…</div></div>`;
  }

  html += `<h3>Detection (T1)</h3>`;
  html += status.detector
    ? `<div class="note">Basin-wide detection runs over a whole scene rather than
       one storm. Query <code>/api/vision/detect?time=…</code>; verified skill is
       in the Skill tab.</div>`
    : unavailable("detector not trained yet");
  el.innerHTML = html;
  if(scene.available || inten.available) renderCams(d, issued);
}

/* Grad-CAM panels. fetch rather than <img> so the attention share in the
   response headers can be read and printed under each map. */
async function renderCams(d, issued){
  const box = document.getElementById("cam-box");
  const t = issued ? `&time=${encodeURIComponent(issued)}` : "";
  const one = async (task, label) => {
    try{
      const r = await api(`/api/storm/${d.sid}/explain.png?task=${task}${t}`);
      const share = parseFloat(r.headers.get("X-Share-In-Core"));
      const area = parseFloat(r.headers.get("X-Core-Area-Share"));
      const url = URL.createObjectURL(await r.blob());
      return `<figure style="margin:0 0 12px">
        <img src="${url}" alt="${label}: infrared patch and attention map" style="width:100%;border:1px solid var(--rule-2)">
        <figcaption style="font-size:11px;color:var(--ink-2);margin-top:4px"><b>${label}</b> &middot;
          ${(100*share).toFixed(0)}% of the attention within 150 km of the centre
          (the ring), an area that is ${(100*area).toFixed(1)}% of the patch</figcaption></figure>`;
    }catch(e){ return ""; }
  };
  const [a, b] = await Promise.all([one("scene", "Scene type (CNN half)"), one("intensity", "Intensity")]);
  if(!document.getElementById("cam-box")) return;
  box.innerHTML = (a + b) || `<div class="empty">Attention maps unavailable.</div>`;
  box.insertAdjacentHTML("beforeend", `<div class="note">Grad-CAM: the last network
    stage's features weighted by how much each moved the answer. Left, the
    infrared patch (cold cloud white); right, the same patch with the regions
    that drove the answer glowing. Coarse by design, about 55 km a cell. It
    answers one question: is the model looking at the storm?</div>`);
}

/* ---- satellite overlay ------------------------------------------------- */
let satOn = false;

let satSource = "gridsat";
async function setSatellite(on, when, source="gridsat"){
  satOn = on;
  satSource = source;
  document.getElementById("satToggle").setAttribute("aria-pressed", String(on));
  if(!mapReady) return;   // no layers to hang the imagery on yet
  if(map.getLayer("sat-l")) map.removeLayer("sat-l");
  if(map.getSource("sat")) map.removeSource("sat");
  // grey boundaries vanish into infrared greys; gold reads on both
  map.setPaintProperty("borders-l", "line-color", on && when ? "#e0b400" : "#8c8c8c");
  if(!on || !when) return;
  try{
    const meta = await (await api(`/api/vision/scene_meta?time=${encodeURIComponent(when)}&source=${source}`)).json();
    const b = meta.bounds;
    map.addSource("sat", {type:"image",
      url:`/api/vision/scene.png?time=${encodeURIComponent(when)}&source=${source}`,
      coordinates:[[b.west,b.north],[b.east,b.north],[b.east,b.south],[b.west,b.south]]});
    // Over the land fill, under the boundaries and storm markers.
    map.addLayer({id:"sat-l",type:"raster",source:"sat",
      paint:{"raster-opacity":0.82}}, "borders-l");
  }catch(e){
    document.getElementById("satToggle").setAttribute("aria-pressed","false");
    map.setPaintProperty("borders-l", "line-color", "#8c8c8c");
    satOn = false;
  }
}

/* ---- the full chain ---------------------------------------------------- */
async function runPipeline(when, source="gridsat", elId="pane-pl"){
  const el = document.getElementById(elId);
  el.innerHTML = `<div class="empty">Running detection → association → scene → intensity → forecast…<br>
    <span style="font-size:11px">this reads ~9 satellite scenes, give it a moment</span></div>`;
  let res;
  try{
    res = await (await api(`/api/vision/pipeline?time=${encodeURIComponent(when)}&level=${level}&source=${source}`)).json();
  }catch(e){ el.innerHTML = `<div class="empty">Pipeline failed (${e}).</div>`; return; }

  if(!res.available){ el.innerHTML = `<div class="alert quiet"><b>Unavailable</b>${res.reason}</div>`; return; }

  const feats = [], lines = [];
  for(const s of res.storms){
    for(const h of s.history) feats.push({type:"Feature",
      geometry:{type:"Point",coordinates:[h.lon,h.lat]},
      properties:{time:h.time, score:s.detection_score, scene:h.scene||"", vmax:h.vmax_kt||0}});
    if(s.history.length>1) lines.push({type:"Feature",
      geometry:{type:"LineString",coordinates:s.history.map(h=>[h.lon,h.lat])}});
  }
  src("dets",{type:"FeatureCollection",features:feats});
  src("dettrack",{type:"FeatureCollection",features:lines});

  el.innerHTML = `
    <h2>${source === "live" ? "Live chain" : "Pipeline"}</h2>
    <div class="sub">imagery in, storms out &middot; ${ist(res.window_end)}${source === "live" ? " &middot; INSAT" : ""}</div>
    <dl class="stats">
      <div><dt>Scenes read</dt><dd>${res.scenes_examined}</dd></div>
      <div><dt>Tracks found</dt><dd>${res.tracks_found}</dd></div>
    </dl>
    ${res.storms.map(s=>`
      <h3>${s.id} &middot; ${s.track_points} fixes</h3>
      <dl class="stats">
        <div><dt>Position</dt><dd>${s.lat.toFixed(1)}N ${s.lon.toFixed(1)}E</dd></div>
        <div><dt>Confidence</dt><dd>${s.detection_score.toFixed(2)}</dd></div>
        <div><dt>Scene (T2)</dt><dd style="font-size:.9rem">${s.scene||"—"}</dd></div>
        <div><dt>Intensity (T3)</dt><dd>${s.vmax_kt!=null?s.vmax_kt.toFixed(0)+" kt":"—"}</dd></div>
      </dl>
      ${s.prediction ? `<table><thead><tr><th>Lead</th><th>Position</th><th>Intensity</th><th>Cone</th></tr></thead><tbody>
        ${s.prediction.forecast.map(p=>`<tr>
          <td class="n">${p.horizon_h} h</td>
          <td class="n">${p.lat.toFixed(1)}N ${p.lon.toFixed(1)}E</td>
          <td class="n">${p.vmax_kt.toFixed(0)} kt</td>
          <td class="n">±${p.radius_km.toFixed(0)} km</td></tr>`).join("")}
      </tbody></table>` : `<div class="alert quiet"><b>No forecast</b>Track too short to derive motion.</div>`}
    `).join("")}
    ${!res.storms.length ? `<div class="alert quiet"><b>No cyclone detected</b>
      Nothing in these ${res.scenes_examined} scenes cleared the detection threshold
      on two or more consecutive scans.</div>` : ""}
    <div class="note">Nothing above was told where a storm is — detection, scene
      typing and intensity all come from the satellite image, and the forecast
      runs off the detected track. Verified on Amphan, Tauktae and Biparjoy:
      centres found within 39–66 km, and 11 of 12 forecast positions fell inside
      their stated cone. Intensity from the image alone came within 5–6 kt on
      Amphan and Tauktae and 19 kt low on Biparjoy — reading the strongest
      storms low is the weak link, and the Skill tab gives it by band.</div>`;
}

async function renderLive(){
  const el = document.getElementById("pane-lv");
  el.innerHTML = `<div class="empty">Checking the live feed…</div>`;
  let st;
  try{ st = await (await api("/api/live/status")).json(); }
  catch(e){ el.innerHTML = `<div class="empty">Live status unavailable.</div>`; return; }
  if(!st.available){
    el.innerHTML = `<h2>Live</h2><div class="alert quiet"><b>No live scenes yet</b>
      Fetch the latest INSAT imagery with <code>${esc(st.refresh)}</code>.</div>`;
    return;
  }
  const last = st.scenes[st.scenes.length - 1];
  el.innerHTML = `
    <h2>Live</h2>
    <div class="sub">${esc(last.satellite)} &middot; full-sector scans from MOSDAC, on the model grid</div>
    <dl class="stats">
      <div><dt>Latest scene</dt><dd>${ist(st.latest)}</dd></div>

      <div><dt>Scenes held</dt><dd>${st.scenes.length}</dd></div>

    </div>

    <div id="lv-out"></div>
    <div class="note">Showing the live scene hides the selected storm's track and cone;
      pick a storm in the header to bring them back. The same models as every other tab,
      fed today's INSAT imagery instead of the GridSat archive. MOSDAC publishes a scan about an hour after
      it is taken. Refresh with <code>${esc(st.refresh)}</code>.</div>`;
  const when = st.latest.replace("T", " ");
  document.getElementById("lv-show").onclick = async () => {
    // a past storm's track and cone drawn over today's sky would read as a
    // forecast for today; clear them until a storm is picked again
    const none = {type:"FeatureCollection", features:[]};
    for(const id of ["cone","track","fcline","pts","fpts","dettrack","windprob"]) src(id, none);
    map.fitBounds([[40, -2], [100, 30]], {padding:30, duration:600});
    await setSatellite(true, when, "live");
    try{
      const d = await (await api(`/api/vision/detect?time=${encodeURIComponent(when)}&source=live`)).json();
      const s = d.strongest;
      document.getElementById("lv-detect").innerHTML = !d.available ? "" :
        d.detections.length
          ? `<div class="alert"><b>${d.detections.length} candidate${d.detections.length > 1 ? "s" : ""} in this scene</b>
             ${d.detections.map(x => `${x.lat.toFixed(1)}N ${x.lon.toFixed(1)}E (score ${x.score.toFixed(2)})`).join(" · ")}</div>`
          : `<div class="alert quiet"><b>No candidate above ${d.threshold.toFixed(2)}</b>
             Strongest response ${s.score.toFixed(2)} at ${s.lat.toFixed(1)}N ${s.lon.toFixed(1)}E.</div>`;
      src("dets", {type:"FeatureCollection", features:d.detections.map(x => ({type:"Feature",
        geometry:{type:"Point", coordinates:[x.lon, x.lat]},
        properties:{time:d.scene_time, score:x.score, scene:"", vmax:0}}))});
    }catch(e){ /* the overlay alone is still useful */ }
  };
  document.getElementById("lv-run").onclick = () => runPipeline(when, "live", "lv-out");
}

async function renderSkill(){

  try{
    const s=await (await api("/api/skill")).json();
    const ci = s.forecast_ci?.results || [];
    const t = ci.filter(r => r.task === "track");
    const i = ci.filter(r => r.task === "intensity");
    const fcTable = (rows, unit, dp) => `
      <table><thead><tr><th>Lead</th><th>CLIPER</th><th>Chakravat</th><th>Skill</th><th>95% interval</th></tr></thead>
      <tbody>${rows.map(r=>`<tr><td class="n">${r.horizon_h} h</td>
        <td class="n">${r.cliper.toFixed(dp)} ${unit}</td>

        <td class="n" style="color:var(--ink-3)">${pct(r.skill_ci95[0])} to ${pct(r.skill_ci95[1])}</td></tr>`).join("")}</tbody></table>`;

    const d = s.detection, dn = d?.named_only, cvI = s.cv_intensity, cvS = s.cv_scene;

    el.innerHTML=`

      <h3>Intensity error, forecast as served</h3>
      ${i.length ? fcTable(i, "kt", 2) : ""}
      <div class="note">CLIPER is climatology plus persistence, the benchmark operational
        centres score skill against. Intervals come from resampling whole storms 2,000
        times; where one crosses zero, as at 72 h, the skill is real on this sample but

      <h3>Cone coverage</h3>

        <td class="n">${r.horizon_h} h</td>

        <td class="n">${(100*r.coverage_67).toFixed(0)}%</td>
        <td class="n">${(100*r.coverage_90).toFixed(0)}%</td></tr>`).join("")}</tbody></table>
      <div class="note">A 67% cone should contain about 67% of verifying positions. Ours

      ${lf ? `<h3>Landfall</h3>
      <table><thead><tr><th></th><th>Chakravat</th><th>Baseline</th></tr></thead><tbody>
        <tr><td>timing</td><td class="n"><strong>${lf.timing.model_mae_h.toFixed(1)} h</strong></td>
            <td class="n">${lf.timing.baseline_mae_h.toFixed(1)} h</td></tr>
        <tr><td>position, mean</td><td class="n"><strong>${lf.position.hybrid_mean_km.toFixed(0)} km</strong></td>

        <tr><td>intensity at coast</td><td class="n"><strong>${lf.intensity.model_mae_kt.toFixed(1)} kt</strong></td>

            <td class="n" style="color:var(--ink-3)">${cvI.predict_the_mean.rmse_ci95.map(v=>v.toFixed(1)).join(" to ")}</td>
            <td class="n">${cvI.predict_the_mean.bias.toFixed(1)}</td>
            <td class="n">${(100*cvI.predict_the_mean.imd_category_exact).toFixed(0)}%</td></tr>
        <tr><td>cold-cloud statistics</td>
            <td class="n">${cvI.cold_cloud.rmse.toFixed(2)} kt</td>
            <td class="n" style="color:var(--ink-3)">${cvI.cold_cloud.rmse_ci95.map(v=>v.toFixed(1)).join(" to ")}</td>
            <td class="n">${cvI.cold_cloud.bias.toFixed(1)}</td>
            <td class="n">${(100*cvI.cold_cloud.imd_category_exact).toFixed(0)}%</td></tr>

            <td class="n">${bench.adt.rmse.toFixed(2)} kt</td>

        <tr><td>chakravat</td>

            <td class="n"><strong>${cvI.cnn_raw.bias.toFixed(1)}</strong></td>
            <td class="n"><strong>${(100*cvI.cnn_raw.imd_category_exact).toFixed(0)}%</strong></td></tr>
      </tbody></table>
      <table style="margin-top:8px"><thead><tr><th>Truth band</th>${Object.keys(cvI.cnn_raw.bands).map(b=>`<th>${b}</th>`).join("")}</tr></thead>
      <tbody><tr><td>bias (kt)</td>${Object.values(cvI.cnn_raw.bands).map(b=>`<td class="n">${b.bias==null?"—":b.bias.toFixed(1)}</td>`).join("")}</tr>

      <div class="note">Truth is IMD's best-track wind, interpolated to the scene time.
        ${bench ? `ADT is scored on the same ${bench.n} scenes it covers; the difference
        between it and Chakravat is ${cvI.adt_benchmark.cnn_raw_minus_adt_rmse_ci95.map(v=>v.toFixed(1)).join(" to ")} kt,
        so on this data the two are level while ADT reads ${bench.adt.bias.toFixed(1)} kt high
        and ours ${cvI.cnn_raw.bias.toFixed(1)}.` : ""}
        The band table is the part to read: a single RMSE hides that weak systems come out
        too strong and the strongest too weak.</div>` : ""}

      <div class="note">Splits are by storm or by season, never by row: consecutive fixes of
        one cyclone are near identical, and a random split would put the same storm on both
        sides. <br><br>Not an IMD product. Official warnings are issued by RSMC New Delhi.</div>`;
  }catch(e){ el.innerHTML=`<div class="empty">Verification data unavailable (${e}).</div>`; }
}

  const seasons=(await (await api("/api/seasons")).json()).seasons;

async function loadSeason(season){
  const list=(await (await api(`/api/storms?season=${season}`)).json()).storms;
  const sel=document.getElementById("storm");
  sel.innerHTML=list.map(s=>`<option value="${s.SID}">${s.name||"Unnamed"} — ${s.peak_kt.toFixed(0)} kt</option>`).join("");
  if(list.length) await loadStorm(list[0].SID);
}

document.getElementById("season").onchange=e=>loadSeason(e.target.value);
document.getElementById("storm").onchange=e=>loadStorm(e.target.value);
document.getElementById("issue").onchange=e=>{ if(current) loadStorm(current.d.sid, e.target.value); };
// data-lvl only: the Satellite button shares the .lvl styling but is not a level
document.querySelectorAll(".lvl button[data-lvl]").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".lvl button[data-lvl]").forEach(x=>x.setAttribute("aria-pressed","false"));
  b.setAttribute("aria-pressed","true"); level=parseFloat(b.dataset.lvl);
  if(current) loadStorm(current.d.sid, current.fc ? current.fc.issued_at : null);
});
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".tabs button").forEach(x=>x.setAttribute("aria-selected","false"));
  document.querySelectorAll(".pane").forEach(p=>p.classList.remove("on"));
  b.setAttribute("aria-selected","true");
  document.getElementById("pane-"+b.dataset.pane).classList.add("on");
  if(b.dataset.pane==="lv") renderLive();
  // The chain reads several scenes, so only run it when actually opened.
  if(b.dataset.pane==="pl" && current && !document.getElementById("pane-pl").dataset.ran){
    document.getElementById("pane-pl").dataset.ran = "1";
    runPipeline(current.fc ? current.fc.issued_at
                           : current.d.track[current.d.track.length-1].time);
  }
});

document.getElementById("satToggle").onclick = () => {
  const when = current ? (current.fc ? current.fc.issued_at
                        : current.d.track[current.d.track.length-1].time) : null;
  setSatellite(!satOn, when);
};
initMap();
</script>
</body>
</html>
